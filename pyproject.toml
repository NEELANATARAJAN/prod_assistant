[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prod-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4==4.14.3",
    "ddgs>=9.0.0",
    "fastapi==0.135.1",
    "html5lib==1.1",
    "jinja2==3.1.6",
    "langchain==1.2.10",
    "langchain-astradb==1.0.0",
    "langchain-community>=0.4.1",
    "langchain-core==1.2.17",
    "langchain-google-genai==4.2.1",
    "langchain-groq==1.1.2",
    "langchain-mcp-adapters==0.2.1",
    "langchain-openai==1.1.10",
    "langgraph==1.0.10",
    "lxml==6.0.2",
    "mcp==1.26.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.22",
    "ragas==0.4.3",
    "selenium==4.41.0",
    "streamlit==1.55.0",
    "structlog==25.5.0",
    "tavily-python>=0.7.23",
    "undetected-chromedriver==3.5.5",
    "uvicorn==0.41.0",
    "webdriver-manager>=4.0.2",
]

# Optional: authors, license
authors = [{ name = "Neela Natarajan"}]
license = { text = "Proprietary"}

# Optional: CLI command (python -m pip install -e . )
[project.scripts]
ecomm-prod_assistant = "prod_assistant.cli:main"

# Mandatory: creating the source files as package
[tool.setuptools.packages.find]
where = ["."]
include = ["assistant*"]
